    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".12"/></pattern>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/>
  <rect width="640" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="500" cy="182" r="158" fill="#d0dfc7" opacity=".09"/>
