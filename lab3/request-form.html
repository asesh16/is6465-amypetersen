<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Request a tutoring session</title>
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>

        <form class="request-form" action="process-request.php" method="post">
            <div class="mb-3">
                <label for="course" class="form-label">Course</label>
                <select id="course" name="course" class="form-select" required>
                    <option value="">Select a course</option>
                    <option value="IS 6465">IS 6465</option>
                    <option value="IS 6495">IS 6495</option>
                    <option value="IS 6570">IS 6570</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="topic" class="form-label">What would you like help with?</label>
                <input type="text" id="topic" name="topic" class="form-control" maxlength="120" required>
            </div>

            <div class="mb-3">
                <label for="preferreddate" class="form-label">Preferred date</label>
                <input type="date" id="preferreddate" name="preferreddate" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="preferredtime" class="form-label">Preferred time</label>
                <select id="preferredtime" name="preferredtime" class="form-select" required>
                    <option value="">Select a time</option>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
                </select>
            </div>

            <button class="btn btn-primary" type="submit">Request session</button>
        </form>
    </main>
</body>

</html>
