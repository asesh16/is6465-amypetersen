<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>
            
        <form class="request-form" action="process-request.php" method="post">        
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="course" class="form-label">Course</label>
                    <input id="course" name="course" class="form-control" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="date" class="form-label">Preferred date</label>
                    <input id="date" name="date" type="date" class="form-control" required>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary"> Request session </button>
                </div>
            </div>
        </form>
    </main>
